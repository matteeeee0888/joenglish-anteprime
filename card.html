<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Card area membri | JoEnglish</title><style>body{margin:0;padding:40px 16px;background:#f4f7fb}</style></head><body>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
.je-callcard{font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#132883;color:#fff;border-radius:24px;padding:22px 24px;display:flex;align-items:center;gap:20px;max-width:860px;margin:24px auto;box-shadow:0 18px 36px -20px rgba(19,40,131,.6);position:relative;overflow:hidden}
.je-callcard *{box-sizing:border-box}
.je-callcard:before{content:"";position:absolute;right:-60px;bottom:-80px;width:260px;height:220px;background:#2bb6f3;opacity:.25;border-radius:42% 58% 63% 37% / 45% 40% 60% 55%}
.je-callcard img{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:top;border:4px solid #fff;background:#fff;flex:none;position:relative}
.je-callcard-txt{flex:1;min-width:0;position:relative}
.je-callcard-tag{display:inline-block;background:#ffc629;color:#132883;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 10px;margin-bottom:6px}
.je-callcard h3{font-family:"Gochi Hand",cursive;font-weight:400;font-size:30px;line-height:1.05;margin:0 0 4px;color:#fff}
.je-callcard p{margin:0;font-size:15px;line-height:1.45;color:#c9d6f2}
.je-callcard a{flex:none;position:relative;display:inline-block;background:#15cd91;color:#fff;font-weight:800;font-size:16px;text-decoration:none;border-radius:12px;padding:13px 18px;box-shadow:0 5px 0 #0ea374;white-space:nowrap}
.je-callcard a:hover{transform:translateY(2px);box-shadow:0 3px 0 #0ea374}
@media (max-width:640px){.je-callcard{flex-direction:column;text-align:center;padding:22px 18px}.je-callcard a{width:100%}}
</style>
<div class="je-callcard">
  <img src="https://joenglish.com/userfiles/image_cache/layout/640x640-cr/j/o/e/-/n/joe-new-largepng.png" alt="Joe">
  <div class="je-callcard-txt">
    <span class="je-callcard-tag">UN REGALO PER TE</span>
    <h3>Hai una call gratuita con Joe da prenotare</h3>
    <p>20 minuti io e te: mi racconti il tuo obiettivo e ti dico la strada pi&ugrave; veloce per arrivarci. Posti limitati ogni settimana.</p>
  </div>
  <a href="/prenota-call">Prenota la call</a>
</div>

</body></html>
